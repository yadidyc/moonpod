name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update Mooncakes registry
        run: moon update
      - name: Check formatting
        run: moon fmt --check
      - name: Check all stable targets
        run: moon check --target all --deny-warn
      - name: Test
        run: moon test --target all
      - name: Build demo
        run: moon build --target all cmd/main
      - name: Build integration examples
        run: |
          moon build --target all examples/policy_guard
          moon build --target all examples/batch_audit
